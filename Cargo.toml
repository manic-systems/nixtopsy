[package]
name         = "nixtopsy"
version      = "0.1.1"
edition      = "2024"
rust-version = "1.88.0"
description  = "Interactively dissect your Nix closures"
readme       = "README.md"
repository   = "https://github.com/amaanq/nixtopsy"
license      = "MIT"
keywords     = [ "dependencies", "graph", "nix", "store", "tui" ]
categories   = [ "command-line-utilities" ]

[[bin]]
name = "nixtopsy"
path = "src/main.rs"

[dependencies]
crossterm  = "0.29.0"
pound      = "0.6.1"
ratatui    = { version = "0.30.0", default-features = false, features = [ "crossterm" ] }
serde      = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

absolute_paths                  = "allow"
arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
default_numeric_fallback        = "allow"
doc_markdown                    = "allow"
else_if_without_else            = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
expect_used                     = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
iter_over_hash_type             = "allow"
let_underscore_must_use         = "allow"
let_underscore_untyped          = "allow"
min_ident_chars                 = "allow"
missing_asserts_for_indexing    = "allow"
missing_docs_in_private_items   = "allow"
missing_errors_doc              = "allow"
missing_inline_in_public_items  = "allow"
missing_panics_doc              = "allow"
missing_trait_methods           = "allow"
module_name_repetitions         = "allow"
multiple_crate_versions         = "allow"
must_use_candidate              = "allow"
needless_pass_by_value          = "allow"
non_ascii_literal               = "allow"
pattern_type_mismatch           = "allow"
print_stderr                    = "allow"
print_stdout                    = "allow"
question_mark_used              = "allow"
range_plus_one                  = "allow"
separated_literal_suffix        = "allow"
shadow_reuse                    = "allow"
shadow_unrelated                = "allow"
single_call_fn                  = "allow"
single_char_lifetime_names      = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
str_to_string                   = "allow"
string_slice                    = "allow"
struct_excessive_bools          = "allow"
too_many_lines                  = "allow"
unwrap_used                     = "allow"
wildcard_enum_match_arm         = "allow"

[profile.release]
opt-level     = "s"
strip         = true
lto           = "fat"
panic         = "abort"
codegen-units = 1
